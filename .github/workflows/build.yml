name: Build Cloudstream Plugins

concurrency:
  group: build
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "**/*.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        yaml - name: Accept Android SDK licenses run: yes | sdkmanager --licenses || true
        with:
          packages: platform-tools

      - name: Build Plugins
        working-directory: ./bombaci
        run: |
          chmod +x gradlew
          find . -path '*/src/main/kotlin/*.kt' -type f | while read -r f; do
            grep -q '@file:Suppress("DEPRECATION_ERROR"' "$f" && continue
            sed -i '1s|^|@file:Suppress("DEPRECATION_ERROR", "DEPRECATION")\n|' "$f"
          done
          ./gradlew make makePluginsJson --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp */build/*.cs3 "$GITHUB_WORKSPACE/out"
          cp build/plugins.json "$GITHUB_WORKSPACE/out"

      - name: Deploy to builds branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: out
          branch: builds
          commit-message: "auto: build plugins"
          force: true
